# Real Data Sources Configuration
sources:
  api_documentation:
    - name: "Stripe API Documentation"
      type: "web_api_docs"
      base_url: "https://docs.stripe.com/api"
      start_urls:
        - "https://docs.stripe.com/api/charges"
        - "https://docs.stripe.com/api/customers"
        - "https://docs.stripe.com/api/payment_intents"
        - "https://docs.stripe.com/api/refunds"
        - "https://docs.stripe.com/api/subscriptions"
      categories: ["api_docs"]
      selector: "main"
      max_depth: 2
      
    - name: "Twilio API Documentation"
      type: "web_api_docs"
      base_url: "https://www.twilio.com/docs"
      start_urls:
        - "https://www.twilio.com/docs/usage/api"
        - "https://www.twilio.com/docs/sms/api"
        - "https://www.twilio.com/docs/voice/api"
      categories: ["api_docs"]
      selector: "main"
      max_depth: 1
      
    - name: "GitHub REST API Documentation"
      type: "web_api_docs"
      base_url: "https://docs.github.com/en/rest"
      start_urls:
        - "https://docs.github.com/en/rest/overview/endpoints-available-for-github-apps"
        - "https://docs.github.com/en/rest/overview/resources-in-the-rest-api"
        - "https://docs.github.com/en/rest/repos"
      categories: ["api_docs"]
      selector: "main"
      max_depth: 1
      
    - name: "AWS S3 API Documentation"
      type: "web_api_docs"
      base_url: "https://docs.aws.amazon.com/s3/"
      start_urls:
        - "https://docs.aws.amazon.com/s3/latest/userguide/using-with-s3-actions.html"
        - "https://docs.aws.amazon.com/s3/latest/userguide/Welcome.html"
      categories: ["api_docs"]
      selector: "main"
      max_depth: 1
      
    - name: "PayPal API Documentation"
      type: "web_api_docs"
      base_url: "https://developer.paypal.com/docs/api/"
      start_urls:
        - "https://developer.paypal.com/docs/api/overview/"
        - "https://developer.paypal.com/docs/api/payments/"
      categories: ["api_docs"]
      selector: "main"
      max_depth: 1
      
    - name: "Slack API Documentation"
      type: "web_api_docs"
      base_url: "https://api.slack.com"
      start_urls:
        - "https://api.slack.com/methods"
        - "https://api.slack.com/web"
      categories: ["api_docs"]
      selector: "main"
      max_depth: 1
      
  technical_documentation:
    - name: "Python Official Documentation"
      type: "web_tech_docs"
      base_url: "https://docs.python.org/3/"
      start_urls:
        - "https://docs.python.org/3/tutorial/"
        - "https://docs.python.org/3/library/"
      categories: ["technical"]
      selector: "div.body"
      max_depth: 2
      
    - name: "Docker Documentation"
      type: "web_tech_docs"
      base_url: "https://docs.docker.com"
      start_urls:
        - "https://docs.docker.com/get-started/"
        - "https://docs.docker.com/reference/"
      categories: ["technical"]
      selector: "main"
      max_depth: 1
      
    - name: "Kubernetes Documentation"
      type: "web_tech_docs"
      base_url: "https://kubernetes.io/docs/"
      start_urls:
        - "https://kubernetes.io/docs/concepts/"
        - "https://kubernetes.io/docs/tutorials/"
      categories: ["technical"]
      selector: "main"
      max_depth: 1
      
    - name: "PostgreSQL Documentation"
      type: "web_tech_docs"
      base_url: "https://www.postgresql.org/docs/"
      start_urls:
        - "https://www.postgresql.org/docs/current/"
        - "https://www.postgresql.org/docs/current/tutorial.html"
      categories: ["technical"]
      selector: "div.NAVHEADER"
      max_depth: 1
      
    - name: "React Documentation"
      type: "web_tech_docs"
      base_url: "https://react.dev"
      start_urls:
        - "https://react.dev/learn"
        - "https://react.dev/reference/react"
      categories: ["technical"]
      selector: "main"
      max_depth: 1
      
    - name: "MongoDB Documentation"
      type: "web_tech_docs"
      base_url: "https://docs.mongodb.com"
      start_urls:
        - "https://docs.mongodb.com/manual/"
        - "https://docs.mongodb.com/manual/tutorial/"
      categories: ["technical"]
      selector: "main"
      max_depth: 1
      
    - name: "Redis Documentation"
      type: "web_tech_docs"
      base_url: "https://redis.io/docs/"
      start_urls:
        - "https://redis.io/docs/get-started/"
        - "https://redis.io/docs/manual/"
