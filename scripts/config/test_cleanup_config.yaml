# Small test configuration for cleanup testing

generation:
  prefix: "TESTCLEAN"
  spaces:
    - key: "TECH"
      name: "Technical Documentation Test"
      pages_count: 3
      categories: ["installation", "architecture"]
    - key: "API"
      name: "API Documentation Test"  
      pages_count: 2
      categories: ["rest"]
  
  content:
    languages: ["en"]
    min_words: 50
    max_words: 100
    include_code_blocks: false
    include_tables: false
    include_lists: false
  
  attachments:
    enabled: false
  
  search_optimization:
    semantic_pairs: false
    cql_friendly_metadata: false
    hybrid_optimized_content: false

safety:
  dry_run: false
  confirm_before_create: false
  auto_cleanup_on_error: true