[project]
name = "confluence-gateway"
version = "0.1.0"
description = "AI-powered Confluence search with RAG integration (Beta)"
authors = [
    {name = "nj.jo",email = "jonamjun.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "atlassian-python-api>=4.0.4",
    "chromadb>=1.0.15",
    "fastapi>=0.115.14",
    "httpx>=0.28.1",
    "litellm>=1.73.6",
    "llama-index-core>=0.12.34.post1",
    "markitdown>=0.1.2",
    "multidict>=6.6.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.14.3",
    "requests>=2.32.4",
    "sentence-transformers>=4.1.0",
    "tiktoken>=0.9.0",
    "typer>=0.15.4",
    "unstructured>=0.18.2",
]

[project.scripts]
confluence-gateway = "confluence_gateway.cli.main:app"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.26.0",
    "pytest-lazy-fixture>=0.6.3",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.1",
    "types-requests>=2.32.4.20250611",
]

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP",   # pyupgrade
]
lint.ignore = [
    "E501",  # line too long
]
lint.fixable = ["E", "F", "I", "UP"]
target-version = "py310"
src = [
    "confluence_gateway",
    "tests",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F811", "F401", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
plugins = "pydantic.mypy"
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_explicit = false
disallow_any_generics = false
ignore_missing_imports = true
implicit_optional = true

[[tool.mypy.overrides]]
module = "pydantic.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "confluence_gateway.adapters.*"
