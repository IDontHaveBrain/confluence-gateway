[project]
name = "confluence-gateway"
version = "0.1.0"
description = "AI-powered Confluence search with RAG integration (Beta)"
authors = [
    {name = "nj.jo",email = "jonamjun.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "atlassian-python-api>=4.0.4",
    "chromadb>=1.0.15",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "litellm>=1.74.0.post2",
    "llama-index-core>=0.12.48",
    "markitdown>=0.1.2",
    "multidict>=6.6.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.14.3",
    "requests>=2.32.4",
    "sentence-transformers>=5.0.0",
    "tiktoken>=0.9.0",
    "typer>=0.16.0",
    "unstructured>=0.18.5",
]

[project.scripts]
confluence-gateway = "confluence_gateway.cli.main:app"

[tool.uv]
package = true

[tool.setuptools.package-data]
confluence_gateway = ["confluence_gateway_config.json"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "httpx>=0.28.1",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "psutil>=6.1.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.3",
    "types-requests>=2.32.4.20250611",
    "vulture>=2.14",
]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "PTH",  # flake8-use-pathlib
    "W",
]
lint.ignore = [
    "E501",
]
lint.fixable = ["E", "F", "I", "UP", "PTH", "W"]
target-version = "py310"
src = [
    "confluence_gateway",
    "tests",
]
exclude = [
    "scripts",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F811", "F401", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
plugins = "pydantic.mypy"
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_explicit = false
disallow_any_generics = true
ignore_missing_imports = true
implicit_optional = true
exclude = [
    "scripts",
    "build",
    "dist",
    ".venv",
    "venv",
    "__pycache__",
    ".git",
]

[[tool.mypy.overrides]]
module = [
    "atlassian.*",
    "chromadb.*",
    "fastapi.*",
    "httpx.*",
    "litellm.*",
    "llama_index.*",
    "markitdown.*",
    "multidict.*",
    "pydantic.*",
    "qdrant_client.*",
    "requests.*",
    "sentence_transformers.*",
    "tiktoken.*",
    "typer.*",
    "unstructured.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "confluence_gateway.adapters.*"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.vulture]
exclude = ["tests/", "scripts/", ".venv/", "build/", "dist/"]
ignore_decorators = ["@app.route", "@router.*", "@pytest.*", "@typer.*", "@click.*"]
ignore_names = ["main", "app", "cli", "version_flag"]
min_confidence = 80
sort_by_size = true
paths = ["confluence_gateway"]
