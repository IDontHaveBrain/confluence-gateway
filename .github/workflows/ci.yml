name: CI

on:
  push:
    branches: [ main, master, develop, 'refactor/*' ]
  pull_request:
    branches: [ main, master, develop, 'refactor/*' ]

env:
  # Vector database configuration for CI environment
  VECTOR_DB_TYPE: "qdrant"
  VECTOR_DB_EMBEDDING_DIMENSION: "384"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Verify UV installation
      run: |
        uv --version

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Cache UV
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-3.13-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.13-
          ${{ runner.os }}-uv-

    - name: Cache pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-

    - name: Setup pre-commit
      run: |
        uv run pre-commit install

    - name: Run pre-commit hooks (includes ruff, mypy, etc.)
      run: |
        uv run pre-commit run --all-files

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    env:
      # Test isolation environment variables
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # Vector database file storage configuration
      VECTOR_DB_TYPE: "qdrant"
      VECTOR_DB_EMBEDDING_DIMENSION: "384"
      QDRANT_LOCAL_PATH: "${{ github.workspace }}/.cache/qdrant"
      CHROMA_PERSIST_PATH: "${{ github.workspace }}/.cache/chromadb"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Verify UV installation
      run: |
        uv --version

    - name: Cache UV
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ matrix.python-version }}-
          ${{ runner.os }}-uv-

    - name: Generate content manifest
      id: content_manifest
      run: |
        # Create content manifest for cache key generation
        (
          echo "Tests content:"
          find tests/ -name '*.py' -type f -exec sha256sum {} \; | sort
          echo "Config files:"
          find . -name '*.json' -o -name '*.yaml' -o -name '*.yml' -o -name '*.toml' | grep -E '(config|conf|setup)' | head -20 | xargs -I {} sh -c 'echo "{}:" && sha256sum "{}"' 2>/dev/null || true
          echo "Core source:"
          find confluence_gateway/ -name '*.py' -type f | head -10 | xargs -I {} sh -c 'echo "{}:" && sha256sum "{}"'
        ) > content_manifest.txt
        
        # Generate cache key from manifest
        CONTENT_HASH=$(sha256sum content_manifest.txt | cut -d' ' -f1)
        echo "content_hash=${CONTENT_HASH}" >> $GITHUB_OUTPUT
        
        # Generate config fingerprint
        CONFIG_FINGERPRINT=$(echo "${{ matrix.python-version }}-${{ env.VECTOR_DB_TYPE }}-${{ env.VECTOR_DB_EMBEDDING_DIMENSION }}" | sha256sum | cut -d' ' -f1)
        echo "config_fingerprint=${CONFIG_FINGERPRINT}" >> $GITHUB_OUTPUT
        
        # Combined cache key
        CACHE_KEY="v2-vector-db-${{ runner.os }}-py${{ matrix.python-version }}-${CONFIG_FINGERPRINT:0:8}-${CONTENT_HASH:0:8}"
        echo "cache_key=${CACHE_KEY}" >> $GITHUB_OUTPUT

    - name: Setup vector database cache directories
      run: |
        mkdir -p "${{ github.workspace }}/.cache/qdrant"
        mkdir -p "${{ github.workspace }}/.cache/chromadb"
        chmod 755 "${{ github.workspace }}/.cache/qdrant"
        chmod 755 "${{ github.workspace }}/.cache/chromadb"

    - name: Cache vector database storage
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/.cache/qdrant
          ${{ github.workspace }}/.cache/chromadb
        key: ${{ steps.content_manifest.outputs.cache_key }}
        restore-keys: |
          v2-vector-db-${{ runner.os }}-py${{ matrix.python-version }}-${{ steps.content_manifest.outputs.config_fingerprint }}-
          v2-vector-db-${{ runner.os }}-py${{ matrix.python-version }}-
          v2-vector-db-${{ runner.os }}-

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Validate cache and setup test environment
      run: |
        # Check cache restoration status
        if [ -f "${{ github.workspace }}/.cache/qdrant/.cache_metadata" ]; then
          echo "✅ Vector database cache restored successfully"
          cat "${{ github.workspace }}/.cache/qdrant/.cache_metadata"
        else
          echo "🔄 Starting with empty vector database cache"
        fi
        
        # Configure test environment for file storage
        echo '{
          "vector_db": {
            "type": "qdrant",
            "qdrant_local_path": "'"${{ github.workspace }}/.cache/qdrant"'",
            "qdrant_url": null,
            "embedding_dimension": 384
          }
        }' > ~/.confluence_gateway_config.json
        
        # Display final configuration
        echo "📋 Test configuration:"
        cat ~/.confluence_gateway_config.json
        
        # Set directory permissions
        chmod -R 755 "${{ github.workspace }}/.cache/"

    - name: Verify CLI installation
      run: |
        uv run confluence-gateway --help

    - name: Run all E2E tests
      run: |
        uv run pytest tests/ -v --tb=short
      continue-on-error: false

    - name: Update cache metadata
      if: always()
      run: |
        # Create cache metadata for future validation
        (
          echo "Cache created: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Python version: ${{ matrix.python-version }}"
          echo "Content hash: ${{ steps.content_manifest.outputs.content_hash }}"
          echo "Config fingerprint: ${{ steps.content_manifest.outputs.config_fingerprint }}"
          echo "Cache key: ${{ steps.content_manifest.outputs.cache_key }}"
        ) > "${{ github.workspace }}/.cache/qdrant/.cache_metadata"
        
        # Log cache status
        echo "📊 Cache statistics:"
        du -sh "${{ github.workspace }}/.cache/qdrant" 2>/dev/null || echo "Qdrant cache: empty"
        du -sh "${{ github.workspace }}/.cache/chromadb" 2>/dev/null || echo "ChromaDB cache: empty"
        
        # List cache contents for debugging
        echo "📂 Cache contents:"
        ls -la "${{ github.workspace }}/.cache/qdrant/" 2>/dev/null || echo "Qdrant cache empty"
        ls -la "${{ github.workspace }}/.cache/chromadb/" 2>/dev/null || echo "ChromaDB cache empty"

  test-integration:
    name: Integration Test (Full Pipeline)
    runs-on: ubuntu-latest
    needs: [code-quality, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    env:
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # Keep memory mode for integration tests to avoid conflicts
      QDRANT_URL: ":memory:"
      CHROMA_PERSIST_PATH: ""
      VECTOR_DB_TYPE: "qdrant"
      VECTOR_DB_EMBEDDING_DIMENSION: "384"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Configure test environment
      run: |
        # Keep memory mode for integration tests to avoid conflicts
        echo '{"vector_db": {"qdrant_url": ":memory:", "qdrant_local_path": null}}' > ~/.confluence_gateway_config.json

    - name: Full integration test
      run: |
        # Test CLI commands work
        uv run confluence-gateway --help
        
        # Test API server can start
        timeout 30 bash -c 'uv run uvicorn confluence_gateway.api.app:app --host 127.0.0.1 --port 8000 &
        while ! curl -f http://127.0.0.1:8000/health 2>/dev/null; do
          sleep 1
        done
        echo "API server started successfully"
        kill %1'

  build-check:
    name: Build Package Check
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Build package
      run: |
        uv build

    - name: Verify package contents
      run: |
        ls -la dist/
        # Verify wheel can be installed
        pip install dist/*.whl
        # Verify CLI works
        confluence-gateway --help >/dev/null
        # Verify version from package metadata
        python -c "import importlib.metadata; print('Package version:', importlib.metadata.version('confluence-gateway'))"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        retention-days: 7

