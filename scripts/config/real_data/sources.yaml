    - name: "Microsoft Azure Cloud Adoption Framework"
      type: "web_kb"
      base_url: "https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/"
      start_urls:
        - "https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/overview"
