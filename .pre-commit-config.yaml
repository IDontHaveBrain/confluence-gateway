exclude: ^scripts/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        args: ["--install-types", "--non-interactive"]
      
      - id: vulture
        name: vulture
        entry: uv run vulture confluence_gateway/ vulture_whitelist.py --min-confidence 90
        language: system
        pass_filenames: false
        always_run: true
