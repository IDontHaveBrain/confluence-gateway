# Very small test configuration for final cleanup testing

generation:
  prefix: "FINALTEST"
  spaces:
    - key: "DEMO"
      name: "Demo Space"
      pages_count: 2
      categories: ["installation"]
  
  content:
    languages: ["en"]
    min_words: 20
    max_words: 50
    include_code_blocks: false
    include_tables: false
    include_lists: false
  
  attachments:
    enabled: false
  
  search_optimization:
    semantic_pairs: false
    cql_friendly_metadata: false
    hybrid_optimized_content: false

safety:
  dry_run: false
  confirm_before_create: false
  auto_cleanup_on_error: true