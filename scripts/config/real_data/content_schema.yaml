# Content Metadata Schema
# Defines the structure for storing collected real content

content_entry:
  id: string  # Unique identifier (hash of source + path)
  source:
    name: string  # Source name from sources.yaml
    type: enum[github_repo, web_scrape, api_endpoint]
    url: string  # Original URL
    fetch_date: datetime
    
  metadata:
    title: string
    description: string
    author: string  # If available
    created_date: datetime  # If available
    modified_date: datetime  # If available
    language: enum[en, ko, es, fr, de, ja, zh, mixed]
    license: string  # License information if available
    
  categorization:
    primary_category: enum[technical, api_docs, knowledge_base, project_docs, multilingual]
    secondary_categories: array[string]
    tags: array[string]  # Extracted keywords
    topics: array[string]  # High-level topics
    
  content:
    format: enum[markdown, html, rst, plain_text, jupyter]
    raw_file_path: string  # Path to raw content file
    processed_file_path: string  # Path to processed content
    word_count: integer
    char_count: integer
    code_blocks_count: integer
    images_count: integer
    tables_count: integer
    
  quality_metrics:
    readability_score: float  # 0-1
    technical_depth: float  # 0-1
    completeness: float  # 0-1
    overall_quality: float  # 0-1
    
  attachments:
    - type: enum[image, pdf, code_file, data_file]
      filename: string
      file_path: string
      size_bytes: integer
      mime_type: string
      
  processing:
    preprocessed: boolean
    validated: boolean
    errors: array[string]
    warnings: array[string]

index_structure:
  version: string
  last_updated: datetime
  total_entries: integer
  categories:
    technical: integer
    api_docs: integer
    knowledge_base: integer
    project_docs: integer
    multilingual: integer
  languages:
    en: integer
    ko: integer
    mixed: integer
    other: integer