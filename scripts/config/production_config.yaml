# Production Configuration for Real Data Collection and Generation

# Real data collection settings
collection:
  # Source types to collect from
  enabled_sources:
    - api_documentation
    - technical_documentation
    - knowledge_base
  
  # Collection targets
  targets:
    api_docs:
      min_documents: 20
      max_documents: 50
      space_key: "API"
    technical:
      min_documents: 20
      max_documents: 50
      space_key: "TECH"
    knowledge_base:
      min_documents: 20
      max_documents: 50
      space_key: "KB"
  
  # Duplicate detection
  duplicate_detection:
    enabled: true
    method: "content_hash"  # content_hash, url_hash, title_similarity
    similarity_threshold: 0.95
  
  # Rate limiting
  rate_limits:
    requests_per_minute: 30
    concurrent_requests: 5
    retry_after_seconds: 60
  
  # Content filtering
  content_filters:
    min_length: 500
    max_length: 100000
    allowed_languages: ["en"]
    exclude_patterns:
      - "test"
      - "example"
      - "demo"

# Confluence generation settings
generation:
  prefix: "TESTDUM"
  spaces:
    - key: "TECH"
      name: "Technical Documentation Test"
      pages_count: 25
      categories: ["technical"]
    - key: "API"
      name: "API Documentation Test"
      pages_count: 20
      categories: ["api_docs", "technical"]
    - key: "KB"
      name: "Knowledge Base Test"
      pages_count: 20
      categories: ["knowledge_base", "technical"]
  
  # Page generation settings
  page_settings:
    add_table_of_contents: true
    add_metadata_section: true
    add_related_links: true
    max_heading_depth: 4
  
  # Attachment settings
  attachments:
    enabled: true
    types: ["pdf", "png", "docx", "xlsx", "txt", "json"]
    max_per_page: 2
    total_size_limit_mb: 100
    generate_from_content: true  # Generate PDFs from collected content
  
  # Safety settings
  safety:
    dry_run: false
    confirm_before_create: false
    enable_tracking: true
    auto_cleanup_on_error: true
    backup_before_delete: true

# Processing settings
processing:
  # Content processing
  content_processing:
    clean_html: true
    convert_markdown: true
    extract_code_blocks: true
    preserve_formatting: true
  
  # Chunk settings for vector DB
  chunking:
    enabled: true
    chunk_size: 1000
    chunk_overlap: 200
    
# Logging and monitoring
monitoring:
  log_level: "INFO"
  log_file: "collection.log"
  metrics_enabled: true
  progress_tracking: true
  
# Cache settings
cache:
  enabled: true
  directory: "cache"
  ttl_hours: 168  # 7 days
  max_size_mb: 1000